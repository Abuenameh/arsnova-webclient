<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="Design interactive lectures and trainings with arsnova." />
    <meta
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
      name="viewport"
    />
    <title>arsnova</title>
    <base href="/" />
    <link
      href="assets/icons/32x32.png"
      rel="icon"
      sizes="32x32"
      type="image/png"
    />
    <link
      href="assets/icons/16x16.png"
      rel="icon"
      sizes="16x16"
      type="image/png"
    />
    <link href="assets/app.webmanifest" rel="manifest" />
    <script type="module">
      import * as QTI from 'https://unpkg.com/@abuenameh/qti-components@next/dist/index.js';
      import 'https://unpkg.com/mathlive?module';
      import { ComputeEngine } from 'https://unpkg.com/@cortex-js/compute-engine?module';
      globalThis.ce = new ComputeEngine();
      globalThis.isEqualToCorrect = (fn, identifier) => {
        return ce
          .parse(fn.variable(identifier))
          .isEqual(ce.parse(fn.correct(identifier)));
      };
      globalThis.setMathfieldStatus = (identifier, status) => {
        setTimeout(() => {
          var pci = document.querySelector(
            `qti-portable-custom-interaction[response-identifier="${identifier}"] > qti-interaction-markup`
          );
          pci?.setAttribute('status', status);
          pci?.dispatchEvent(new CustomEvent('status', { detail: status }));
        });
      };
    </script>
    <script type="text/javascript">
      window.onload = () => {
        let oldHref = document.location.href;
        const body = document.querySelector('body');
        const observer = new MutationObserver((mutations) => {
          if (oldHref !== document.location.href) {
            oldHref = document.location.href;
            window.parent.postMessage(oldHref);
          }
        });
        observer.observe(body, { childList: true, subtree: true });
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tex-math@1.3.3/dist/tex-math.js"></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link href="assets/item.css" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
